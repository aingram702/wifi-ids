; Wi-Fi IDS Sensor — Seeed Studio XIAO ESP32-S3
;
; Build & flash:
;   pio run -t upload -t monitor
;
; If the espressif32 platform version drifts and the build breaks, pin it:
;   platform = espressif32@^6.9.0

[env:seeed_xiao_esp32s3]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; Wi-Fi + BLE together makes a large app; give it room and no OTA slot.
board_build.partitions = huge_app.csv

; BLE tracker detection. Remove this dep and set ENABLE_BLE_SCAN 0 in
; src/config.h for a smaller Wi-Fi-only build.
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Board USB-CDC on boot so Serial shows up over the single USB-C port
    -DARDUINO_USB_CDC_ON_BOOT=1
